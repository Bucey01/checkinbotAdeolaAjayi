# Scheduled Check-In Bot

name: Scheduled Check-In Bot

on:
  workflow_dispatch:
  schedule:
  - cron: "0 14 * * *"

env:
  PRACTICE_API_TOKEN: ${{ secrets.PRACTICE_API_TOKEN }}
  PRACTICE_API_URL: ${{ secrets.PRACTICE_API_URL }}
  INSTRUCTOR_ID: ${{ vars.INSTRUCTOR_ID }}

permissions:
  contents: write

jobs:
  run-checkin-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run check-in bot
      run: python checkin_bot.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: checkin-bot-artifact
        path: artifact/

    - name: Commit updated artifact
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add artifact/

        if ! git diff --cached --quiet; then
          git commit -m "Update check-in bot artifact"
          git push
        else
          echo "No artifact changes to commit."
        fi
